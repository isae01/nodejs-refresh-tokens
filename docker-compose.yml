services:
  postgres:
    image: postgres:16-alpine
    container_name: refresh_tokens_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: refresh_tokens_db
    ports:
      - "5435:5432"
    volumes:
      - refresh_tokens_data:/var/lib/postgresql/data

volumes:
  refresh_tokens_data:
